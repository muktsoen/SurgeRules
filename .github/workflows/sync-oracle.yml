name: Sync Oracle rules

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）运行一次
    - cron: "0 20 * * *"
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream and convert to Surge format
        env:
          POLICY_NAME: "🇺🇸美国节点"
        run: |
          curl -sL "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Oracle/Oracle.yaml" -o /tmp/oracle.yaml
          python3 - <<'EOF'
          import os, re
          policy = os.environ["POLICY_NAME"]
          out, seen = [], set()
          with open("/tmp/oracle.yaml") as f:
              in_payload = False
              for line in f:
                  if line.strip() == "payload:":
                      in_payload = True
                      continue
                  if in_payload:
                      m = re.match(r"\s*-\s*([A-Z-]+,.+)", line)
                      if m:
                          rule = m.group(1).strip()
                          if rule.count(",") == 1:  # 补上策略列
                              rule = f"{rule},{policy}"
                          if rule not in seen:
                              seen.add(rule)
                              out.append(rule)
          with open("Oracle.list", "w") as f:
              f.write("\n".join(out) + "\n")
          print(f"converted {len(out)} rules")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Oracle.list
          git diff --cached --quiet || git commit -m "chore: 自动同步上游 Oracle 规则"
          git push
