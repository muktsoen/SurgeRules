name: Sync Oracle rules

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）运行一次
    - cron: "0 20 * * *"
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream and merge with custom rules
        run: |
          curl -sL "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Oracle/Oracle.yaml" -o /tmp/oracle.yaml
          python3 - <<'EOF'
          import os, re
          from datetime import datetime, timezone, timedelta

          MARKER = "# ===== 自定义规则（自动同步会保留此区域内容） ====="

          # 1. 上游规则：只保留规则类型和域名，不带策略列
          upstream, seen = [], set()
          with open("/tmp/oracle.yaml") as f:
              in_payload = False
              for line in f:
                  if line.strip() == "payload:":
                      in_payload = True
                      continue
                  if in_payload:
                      m = re.match(r"\s*-\s*([A-Z-]+,.+)", line)
                      if m:
                          rule = ",".join(m.group(1).strip().split(",")[:2])
                          if rule not in seen:
                              seen.add(rule)
                              upstream.append(rule)

          # 2. 旧文件中的自定义规则（保留区内容；兼容没有保留区的旧文件）
          custom = []
          if os.path.exists("Oracle.list"):
              with open("Oracle.list") as f:
                  old = [l.rstrip("\n") for l in f]
              if MARKER in old:
                  custom = [l for l in old[old.index(MARKER) + 1:]
                            if l.strip() and not l.startswith("#")]
              else:
                  custom = [l for l in old
                            if l.strip() and not l.startswith("#") and l not in seen]
              custom = [c for c in custom if c not in seen]

          total = len(upstream) + len(custom)
          bj = timezone(timedelta(hours=8))
          now = datetime.now(bj).strftime("%Y-%m-%d %H:%M:%S")

          # 3. 写文件：头部信息 + 上游规则 + 自定义保留区
          out = [
              "# Oracle 分流规则（上游 blackmatrix7/ios_rule_script，每日自动同步）",
              f"# 更新时间：{now}（北京时间）",
              f"# 规则总数：{total}（上游 {len(upstream)}，自定义 {len(custom)}）",
              "",
              *upstream,
              "",
              MARKER,
              *custom,
          ]
          with open("Oracle.list", "w") as f:
              f.write("\n".join(out) + "\n")
          print(f"upstream={len(upstream)} custom={len(custom)} total={total}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Oracle.list
          git diff --cached --quiet || git commit -m "chore: 自动同步上游 Oracle 规则"
          git push
