name: Sync AI rules

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）运行一次
    - cron: "0 20 * * *"
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstreams and merge with custom rules
        run: |
          curl -sL "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/surge/ai.list" -o /tmp/ai1.list
          curl -sL "https://gist.githubusercontent.com/ddgksf2013/cb4121e8b5c5d865cc949cb8120320c4/raw/Ai.yaml" -o /tmp/ai2.yaml
          curl -sL "https://ruleset.skk.moe/List/non_ip/ai.conf" -o /tmp/ai3.conf
          curl -sL "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Facebook/Facebook.list" -o /tmp/ai4.list
          curl -sL "https://github.com/VPSDance/ai-proxy-rules/raw/refs/heads/main/rules/surge/global.list" -o /tmp/ai5.list
          python3 - <<'EOF'
          import os, re
          from datetime import datetime, timezone, timedelta

          MARKER = "# ===== 自定义规则（自动同步会保留此区域内容） ====="

          def read_text_list(path):
              # Surge 原生规则：跳过空行和 # 注释
              rules = []
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      rules.append(line)
              return rules

          def read_clash_yaml(path):
              # ddgksf2013 的 Clash yaml：取 payload 条目，转换规则类型+域名两段
              rules = []
              with open(path) as f:
                  for line in f:
                      m = re.match(r"\s*-\s*([A-Za-z0-9-]+),([^,]+)", line)
                      if m:
                          rules.append(f"{m.group(1)},{m.group(2).strip()}")
              return rules

          SOURCES = [
              ("/tmp/ai1.list", "QuixoticHeart", read_text_list),
              ("/tmp/ai2.yaml", "ddgksf2013", read_clash_yaml),
              ("/tmp/ai3.conf", "skk.moe", read_text_list),
              ("/tmp/ai4.list", "blackmatrix7(Facebook)", read_text_list),
              ("/tmp/ai5.list", "VPSDance", read_text_list),
          ]

          # 1. 上游规则：多源合并去重
          upstream, seen, counts = [], set(), {}
          for path, name, parser in SOURCES:
              lines = parser(path)
              counts[name] = len(lines)
              for line in lines:
                  if line not in seen:
                      seen.add(line)
                      upstream.append(line)

          # 2. 旧文件中的自定义规则（保留区内容；兼容没有保留区的旧文件）
          custom = []
          if os.path.exists("AI.list"):
              with open("AI.list") as f:
                  old = [l.rstrip("\n") for l in f]
              if MARKER in old:
                  custom = [l for l in old[old.index(MARKER) + 1:]
                            if l.strip() and not l.startswith("#")]
              else:
                  custom = [l for l in old
                            if l.strip() and not l.startswith("#") and l not in seen]
              custom = [c for c in custom if c not in seen]

          total = len(upstream) + len(custom)
          bj = timezone(timedelta(hours=8))
          now = datetime.now(bj).strftime("%Y-%m-%d %H:%M:%S")
          src_info = " + ".join(f"{name} {counts[name]}" for _, name, _ in SOURCES)

          # 3. 写文件：头部信息 + 上游规则 + 自定义保留区
          out = [
              "# AI 分流规则（上游每日自动同步）",
              f"# 上游来源：{src_info}",
              f"# 更新时间：{now}（北京时间）",
              f"# 规则总数：{total}（上游去重后 {len(upstream)}，自定义 {len(custom)}）",
              "",
              *upstream,
              "",
              MARKER,
              *custom,
          ]
          with open("AI.list", "w") as f:
              f.write("\n".join(out) + "\n")
          print(f"upstream={len(upstream)} custom={len(custom)} total={total}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI.list
          git diff --cached --quiet || git commit -m "chore: 自动同步上游 AI 规则"
          git push
