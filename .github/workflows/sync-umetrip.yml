name: Sync Umetrip

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Umetrip module
        run: python3 .github/scripts/sync-umetrip.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Umetrip.sgmodule
          if ! git diff --cached --quiet; then
            git commit -m "Sync Umetrip.sgmodule from upstream Loon plugin"
            git push
          fi
