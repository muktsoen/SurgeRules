name: Sync China rules

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）运行一次
    - cron: "0 20 * * *"
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstreams and merge with custom rules
        run: |
          curl -sL "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/surge/cn.list" -o /tmp/cn1.list
          curl -sL "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/surge/cncidr.list" -o /tmp/cn2.list
          curl -sL "https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list" -o /tmp/cn3.list
          python3 - <<'EOF'
          import os
          from datetime import datetime, timezone, timedelta

          MARKER = "# ===== 自定义规则（自动同步会保留此区域内容） ====="

          def read_text_list(path):
              # Surge 原生规则：跳过空行和 # 注释，去 VirgilClyne 式的行内 " // " 注释
              rules = []
              with open(path, encoding="utf-8", errors="replace") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      line = line.split(" // ")[0].strip()
                      if line:
                          rules.append(line)
              return rules

          def rule_key(line):
              # 规则键 = 类型 + 参数（忽略策略列 / no-resolve 等后缀）
              parts = line.split(",")
              rtype = parts[0].strip().upper()
              arg = parts[1].strip().lower() if len(parts) > 1 else ""
              return (rtype, arg)

          SOURCES = [
              ("/tmp/cn1.list", "QuixoticHeart(cn)", read_text_list),
              ("/tmp/cn2.list", "QuixoticHeart(cncidr)", read_text_list),
              ("/tmp/cn3.list", "VirgilClyne(ASN.China)", read_text_list),
          ]

          # 1. 先读旧文件中的自定义规则（保留区内容；兼容没有保留区的旧文件）
          custom = []
          if os.path.exists("China.list"):
              with open("China.list") as f:
                  old = [l.rstrip("\n") for l in f]
              if MARKER in old:
                  custom = [l for l in old[old.index(MARKER) + 1:]
                            if l.strip() and not l.startswith("#")]
              else:
                  custom = [l for l in old
                            if l.strip() and not l.startswith("#")]
          custom_keys = {rule_key(c) for c in custom}

          # 2. 上游规则：多源合并去重。自定义规则优先：与自定义同键的上游条目直接丢掉，
          #    避免上游的无策略条目排在前面、把自定义的带策略条目屏蔽掉。
          upstream, seen, counts = [], set(), {}
          for path, name, parser in SOURCES:
              lines = parser(path)
              counts[name] = len(lines)
              for line in lines:
                  if line not in seen and rule_key(line) not in custom_keys:
                      seen.add(line)
                      upstream.append(line)

          total = len(upstream) + len(custom)
          bj = timezone(timedelta(hours=8))
          now = datetime.now(bj).strftime("%Y-%m-%d %H:%M:%S")
          src_info = " + ".join(f"{name} {counts[name]}" for _, name, _ in SOURCES)

          # 3. 写文件：头部信息 + 上游规则 + 自定义保留区
          out = [
              "# China 分流规则（上游每日自动同步）",
              f"# 上游来源：{src_info}",
              "# 备注：cn.list 不含跨国网络服务提供商在中国大陆可直连的域名",
              f"# 更新时间：{now}（北京时间）",
              f"# 规则总数：{total}（上游去重后 {len(upstream)}，自定义 {len(custom)}）",
              "",
              *upstream,
              "",
              MARKER,
              *custom,
          ]
          with open("China.list", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print(f"upstream={len(upstream)} custom={len(custom)} total={total}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add China.list
          git diff --cached --quiet || git commit -m "chore: 自动同步上游 China 规则"
          git push
